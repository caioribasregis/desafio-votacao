spring.application.name=desafio-votacao

# H2 em modo ficheiro: os dados persistem em ./data/desafio-votacao.mv.db entre reinicios
spring.datasource.url=jdbc:h2:file:./data/desafio-votacao;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# show-sql desligado: imprimir cada SQL no console pesa com muito volume de votos.
# Para depurar, ligue com -Dspring.jpa.show-sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logs
# O SqlExceptionHelper regista os valores da linha rejeitada quando uma restrição é violada,
# o que exporia o CPF no caso de voto duplicado. A exceção continua a ser propagada e tratada.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
